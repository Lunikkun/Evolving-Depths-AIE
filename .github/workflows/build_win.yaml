name: Build Windows EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame numpy pyinstaller
        
    - name: Prepara Cartelle
      shell: bash
      run: |
        touch game_logic/__init__.py
        touch ai/__init__.py
        
    - name: Build with PyInstaller (Add-Data)
      run: pyinstaller --onefile --windowed --add-data "game_logic;game_logic" --add-data "ai;ai" main.py
      
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: EvolvingDepths-Windows
        path: dist/main.exe