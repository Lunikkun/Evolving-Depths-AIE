name: Build Windows EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame numpy pyinstaller
        
    - name: Forza riconoscimento Moduli (Anti-crash)
      shell: bash
      run: |
        # Crea fisicamente i file __init__.py direttamente sul server
        touch game_logic/__init__.py
        touch ai/__init__.py
        
    - name: Build with PyInstaller (Nuclear Option)
      # Usiamo --collect-all per forzare l'inclusione di TUTTO il contenuto delle cartelle
      run: pyinstaller --onefile --windowed --paths . --collect-all game_logic --collect-all ai main.py
      
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: EvolvingDepths-Windows
        path: dist/main.exe